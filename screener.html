<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sleep Disordered Breathing Screener — MYO Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink-bg:#F2F7FB;
  --yellow-bg:#DCE7EF;
  --ink:#1A1F23;
  --coral:#296182;
  --coral-dark:#1B4459;
  --grey-text:#42586A;
  --white:#FFFFFF;
  --border:#D2E3EC;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Open Sans', Arial, sans-serif;
  background:var(--pink-bg);
  color:var(--ink);
}
.site-header{
  width:100%;
  height:44px;
  background:#d1eaf0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px 0 16px;
  position:sticky;
  top:0;
  z-index:100;
}
.site-nav{
  display:flex;
  gap:24px;
}
.site-nav a{
  font-family:'Lora', serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.03em;
  color:var(--ink);
  text-decoration:none;
}
.site-nav a:hover{ color:var(--coral); }
.site-nav a.active{ color:var(--coral); }
.site-header .title{
  font-family:'Lora', serif;
  font-size:18px;
  letter-spacing:1.5px;
  color:var(--ink);
  text-decoration:none;
}
.top-banner{
  background:var(--yellow-bg);
  text-align:center;
  padding:40px 24px 32px;
}
.badge-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:999px;
  padding:7px 16px;
  font-size:12px;
  font-weight:700;
  color:var(--coral);
  margin-bottom:16px;
}
.top-banner h1{
  font-family:'Lora', serif;
  font-size:clamp(22px,4vw,32px);
  font-weight:800;
  line-height:1.2;
  max-width:680px;
  margin:0 auto 12px;
}
.top-banner p{
  color:var(--grey-text);
  font-size:14px;
  line-height:1.6;
  max-width:600px;
  margin:0 auto;
}
.wrap{
  max-width:640px;
  margin:0 auto;
  padding:32px 20px 80px;
}

/* section header card */
.section-head{
  display:flex;
  gap:16px;
  align-items:flex-start;
  background:var(--yellow-bg);
  border-radius:20px;
  padding:24px;
  margin-bottom:24px;
}
.section-icon{
  flex-shrink:0;
  width:44px; height:44px;
  border-radius:50%;
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
}
.section-meta{ font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--coral); margin-bottom:2px; }
.section-head h2{ font-family:'Lora', serif; font-size:20px; font-weight:800; margin:0 0 6px; }
.section-head .sub{ font-size:13px; color:var(--grey-text); margin:0; }

/* progress bar */
.progress-track{
  height:6px;
  background:var(--border);
  border-radius:999px;
  margin-bottom:20px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--coral);
  border-radius:999px;
  transition:width .25s ease;
}

/* questions */
.question{
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:14px;
}
.question p{
  margin:0 0 14px;
  font-size:14.5px;
  font-weight:600;
  line-height:1.5;
}
.yn-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.yn-btn{
  padding:13px;
  border-radius:12px;
  border:1.5px solid var(--border);
  background:var(--white);
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
  transition:background .15s, border-color .15s, color .15s;
}
.yn-btn:hover{ border-color:var(--coral); }
.yn-btn.selected{
  border-color:var(--coral);
  color:var(--white);
}
.yn-btn.selected.negative{
  background:#D64545;
  border-color:#D64545;
}
.yn-btn.selected.positive{
  background:#2E9E4F;
  border-color:#2E9E4F;
}

/* nav buttons */
.nav-row{
  display:flex;
  gap:10px;
  margin-top:24px;
}
.nav-back{
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:999px;
  padding:14px 22px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
}
.nav-next{
  flex:1;
  background:var(--coral);
  color:var(--white);
  border:none;
  border-radius:999px;
  padding:14px 22px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:background .15s;
}
.nav-next:disabled{
  background:#AEC9D8;
  cursor:not-allowed;
}
.nav-next:not(:disabled):hover{ background:var(--coral-dark); }

/* results */
.results-card{
  border-radius:20px;
  padding:32px clamp(20px,4vw,40px);
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}
.results-score{
  font-size:44px;
  font-weight:800;
  margin:0;
}
.results-outof{ font-size:13px; color:var(--grey-text); margin:0 0 14px; }
.results-band{
  font-weight:800;
  font-size:18px;
  margin-bottom:4px;
}
.band-low, .band-mild{ color:#1E7A3C; }
.band-moderate{ color:#8A6300; }
.band-high{ color:#B02E2E; }
.card-low, .card-mild{ background:#E7F7EC; border:1.5px solid #B7E5C4; }
.card-moderate{ background:#FDF6E3; border:1.5px solid #F0DA9B; }
.card-high{ background:#FCEBEB; border:1.5px solid #F4B9B9; }
.icon-low, .icon-mild{ color:#2E9E4F; }
.icon-moderate{ color:#D6A11E; }
.icon-high{ color:#D64545; }
.results-note{
  font-size:13.5px;
  color:var(--grey-text);
  line-height:1.6;
  max-width:440px;
  margin:0 auto;
}
.restart-link{
  display:inline-block;
  margin-top:8px;
  font-size:13px;
  color:var(--coral);
  font-weight:700;
  cursor:pointer;
  text-decoration:underline;
}

/* contact-capture form */
.contact-card{
  background:var(--white);
  border-radius:20px;
  padding:36px clamp(20px,4vw,44px);
  box-shadow:0 4px 20px rgba(0,0,0,.05);
  text-align:center;
}
.contact-icon{
  width:52px; height:52px;
  border-radius:14px;
  background:var(--yellow-bg);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
}
.contact-card h2{ font-family:'Lora', serif; font-size:22px; font-weight:800; margin:0 0 8px; }
.contact-card .sub{
  font-size:14px; color:var(--grey-text); line-height:1.6;
  max-width:420px; margin:0 auto 28px;
}
.field-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  text-align:left;
  margin-bottom:16px;
}
@media (max-width:520px){
  .field-grid{ grid-template-columns:1fr; }
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.field label .req{ color:#D64545; }
.field input, .field textarea{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  font-family:inherit;
  color:var(--ink);
}
.field input:focus, .field textarea:focus{
  outline:none;
  border-color:var(--coral);
}
.field textarea{ resize:vertical; min-height:80px; }
.field-full{ grid-column:1 / -1; text-align:left; margin-bottom:16px; }
.consent-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:var(--pink-bg);
  border-radius:12px;
  padding:14px 16px;
  text-align:left;
  font-size:13px;
  color:var(--grey-text);
  line-height:1.5;
  margin-bottom:20px;
}
.consent-row input{ margin-top:2px; flex-shrink:0; }
.form-error{
  color:#D64545;
  font-size:13px;
  font-weight:600;
  margin:-10px 0 16px;
  text-align:left;
}

/* ---- expanded results page ---- */
.result-icon-wrap{
  width:60px; height:60px;
  border-radius:50%;
  border:2.5px solid currentColor;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
}
.results-band-high{ background:#FCEBEB; border:1.5px solid #F4B9B9; }
.results-band-moderate{ background:#FDF6E3; border:1.5px solid #F0DA9B; }
.results-band-mild, .results-band-low{ background:#E7F7EC; border:1.5px solid #B7E5C4; }
.result-override{
  font-size:13px;
  font-weight:700;
  margin:6px 0 0;
}
.card-block{
  background:var(--white);
  border-radius:20px;
  padding:24px clamp(20px,4vw,32px);
  box-shadow:0 4px 20px rgba(0,0,0,.05);
  margin-top:18px;
  text-align:left;
}
.report-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.report-left{ display:flex; align-items:flex-start; gap:12px; }
.report-icon{
  width:40px; height:40px;
  border-radius:50%;
  background:var(--yellow-bg);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.report-title{ font-size:15px; font-weight:800; margin:0 0 2px; }
.report-email{ font-size:14px; color:var(--grey-text); word-break:break-all; }
.resend-link{
  display:inline-flex; align-items:center; gap:5px;
  font-size:13px; font-weight:700; color:var(--coral);
  text-decoration:none; white-space:nowrap;
}
.report-desc{ font-size:13px; color:var(--grey-text); line-height:1.6; margin:14px 0 0; }

.card-block h3{ font-family:'Lora', serif; font-size:16px; font-weight:800; margin:0 0 14px; }
.card-block .card-sub{ font-size:13px; color:var(--grey-text); margin:-8px 0 16px; }

.breakdown-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px;
  border-radius:12px;
  margin-bottom:8px;
}
.breakdown-row:nth-child(odd){ background:var(--pink-bg); }
.breakdown-left{ display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; }
.breakdown-icon{
  width:28px; height:28px;
  border-radius:50%;
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.breakdown-points{ font-weight:800; font-size:13.5px; }
.pts-red{ color:#B02E2E; }
.pts-green{ color:#1E7A3C; }

.scale-row{
  display:flex;
  border-radius:12px;
  overflow:hidden;
}
.scale-seg{
  flex:1;
  text-align:center;
  padding:14px 6px;
  font-size:12px;
  font-weight:700;
  color:var(--grey-text);
  background:var(--pink-bg);
}
.scale-seg.active{ color:var(--white); }
.scale-seg.active.s-low, .scale-seg.active.s-mild{ background:#2E9E4F; }
.scale-seg.active.s-moderate{ background:#D6A11E; }
.scale-seg.active.s-high{ background:#D64545; }

.next-desc{ font-size:13.5px; color:var(--grey-text); line-height:1.7; margin:0 0 18px; }
.next-desc b{ color:var(--ink); }
.next-buttons{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.next-btn{
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:12px 18px;
  border-radius:999px;
  font-weight:700;
  font-size:13.5px;
  text-decoration:none;
  cursor:pointer;
  border:1.5px solid var(--border);
  background:var(--white);
  color:var(--ink);
  white-space:nowrap;
}
.next-btn.primary{
  background:var(--coral);
  border-color:var(--coral);
  color:var(--white);
}

</style>
</head>
<body>

<div class="site-header">
  <a class="title" href="index.html">MYO EDUCATION</a>
  <nav class="site-nav">
    <a href="index.html">HOME</a>
    <a class="active" href="screening.html">SCREENING</a>
  </nav>
</div>

<div class="top-banner">
  <span class="badge-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M6 4v5a4 4 0 0 0 8 0V4"/><path d="M10 15v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="1.5"/></svg> Orofacial Screener — O.A.S</span>
  <h1>Red Flags for Paediatric Sleep Disordered Breathing</h1>
  <p>A weighted, evidence-informed screening tool to identify risk indicators for paediatric sleep disordered breathing (pSDB). This tool is a clinical screener — not a diagnosis.</p>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============================================================
   PLACEHOLDER SCORING NOTICE (read this before going live)
   ------------------------------------------------------------
   The "weight" values below are a reasonable-looking placeholder
   scaffold, NOT a validated clinical scoring system. Before this
   screener is used with real families, have a clinician review
   and set the actual weights, thresholds, and combo-override
   rules against a real evidence-based pSDB scoring instrument.
   ============================================================ */

const sections = [
  {
    title: "Sleep Behaviour",
    sub: "Answer honestly. Your answers will contribute to a total weighted risk score.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z"/></svg>`,
    questions: [
      { q: "Does your child snore loudly (louder than breathing, audible outside the room)?", w: 4 },
      { q: "Have you ever observed your child stop breathing, gasp, or choke during sleep?", w: 6, flag: "apnea" },
      { q: "Does your child sleep with their mouth open?", w: 4, flag: "mouthBreathing" },
      { q: "Does your child sweat excessively during sleep?", w: 2 },
      { q: "Does your child have restless, unsettled sleep (frequent position changes, falls out of bed)?", w: 3 },
      { q: "Does your child have frequent night terrors or sleepwalking?", w: 2 },
      { q: "Does your child grind or clench their teeth at night (bruxism)?", w: 2 },
      { q: "Do you find your child sleeping with a hyperextended neck?", w: 3 },
      { q: "Does your child have low energy or daytime fatigue?", w: 2 },
      { q: "Did your child bedwet for a long time or still does (enuresis)?", w: 2 },
    ]
  },
  {
    title: "Daytime Behaviour & Functioning",
    sub: "Answer honestly. Your answers will contribute to a total weighted risk score.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    questions: [
      { q: "Does your child appear tired or difficult to wake in the morning despite a full night's sleep?", w: 3 },
      { q: "Does your child have difficulty concentrating, is easily distracted, or has been assessed for ADHD?", w: 3 },
      { q: "Does your child have frequent mood changes, irritability, or behavioural concerns?", w: 2 },
      { q: "Is your child falling asleep at school or during quiet daytime activities?", w: 3 },
      { q: "Does your child have poor school performance or learning difficulties?", w: 2 },
      { q: "Does your child look sad generally and is grumpy a lot?", w: 2 },
    ]
  },
  {
    title: "Breathing & Sleep Health",
    sub: "Answer honestly. Your answers will contribute to a total weighted risk score.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M6 4v5a4 4 0 0 0 8 0V4"/><path d="M10 15v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="1.5"/></svg>`,
    questions: [
      { q: "Does your child breathe through their mouth during the day?", w: 5, flag: "mouthBreathing" },
      { q: "Does your child struggle to keep the lips together?", w: 3 },
      { q: "Does your child have a persistently blocked nose, chronic allergies, or hay fever?", w: 3 },
      { q: "Has your child been told they have enlarged tonsils or adenoids?", w: 4, flag: "tonsils" },
      { q: "When your child spreads the tongue out and says \"ahhh\", can you see the back of the throat where the tonsils sit?", w: 3 },
      { q: "Does your child have frequent ear infections or glue ear (otitis media with effusion)?", w: 2 },
      { q: "Does your child have recurrent throat infections or tonsillitis?", w: 2 },
    ]
  },
  {
    title: "Facial & Dental Development",
    sub: "Answer honestly. Your answers will contribute to a total weighted risk score.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M12 3c-3 0-5 2-5 5 0 3 1 4 1 7 0 2 1 3 2 3s1.5-2 2-2 1.5 2 2 2 2-1 2-3c0-3 1-4 1-7 0-3-2-5-5-5z"/></svg>`,
    questions: [
      { q: "Does your child have crowded, crooked or misaligned teeth?", w: 3 },
      { q: "Does your child have a narrow or high-arched palate?", w: 3 },
      { q: "Does your child have a significant overbite, overjet (buck teeth), underbite, or crossbite?", w: 3 },
      { q: "Does your child have a long, narrow face or a recessed lower jaw?", w: 3 },
      { q: "Has your child had or been referred for orthodontic treatment involving extractions?", w: 2 },
      { q: "Does your child have facial asymmetries (nostrils, eyes, cheeks, chin) or imbalances?", w: 3 },
      { q: "Does your child have black circles under the eyes?", w: 2 },
      { q: "Is your child's profile concave or very convex?", w: 2 },
    ]
  },
  {
    title: "Tongue & Swallowing Function",
    sub: "Answer honestly. Your answers will contribute to a total weighted risk score.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M6 4h12v6a6 6 0 0 1-12 0V4z"/><path d="M9 20c0-2 1.5-3.5 3-3.5s3 1.5 3 3.5"/></svg>`,
    questions: [
      { q: "Does your child have a tongue thrust (tongue pushes between the teeth when swallowing or speaking)?", w: 4 },
      { q: "Does your child have a lisp or difficulty with certain speech sounds (e.g. S, SH, TH)?", w: 3 },
      { q: "Has your child been seen by a speech and language therapist?", w: 1 },
      { q: "Did your child have difficulties breastfeeding or was tongue tie (ankyloglossia) suspected?", w: 2 },
      { q: "Does your child prefer soft foods or avoid hard textures?", w: 2 },
    ]
  },
  {
    title: "Habits & History",
    sub: "Answer honestly. Your answers will contribute to a total weighted risk score.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v2H9z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>`,
    questions: [
      { q: "Has your child used a dummy/pacifier beyond age 3?", w: 1 },
      { q: "Does your child suck their thumb or fingers?", w: 1 },
      { q: "Does your child have frequent headaches or morning headaches?", w: 2 },
      { q: "Does your child have a family history of sleep apnoea or snoring?", w: 2, flag: "familyHistory" },
    ]
  }
];

const totalMaxScore = sections.reduce((sum, s) => sum + s.questions.reduce((a,q) => a+q.w, 0), 0);

let currentSection = 0;
const answers = {}; // key: "sectionIdx-questionIdx" -> true/false

const app = document.getElementById('app');

function questionKey(si, qi){ return si + '-' + qi; }

function renderSection(){
  const s = sections[currentSection];
  const answeredCount = s.questions.filter((_, qi) => answers[questionKey(currentSection, qi)] !== undefined).length;
  const allAnswered = answeredCount === s.questions.length;
  const progressPct = ((currentSection) / sections.length) * 100 + (100/sections.length) * (answeredCount / s.questions.length);

  app.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="section-head">
      <div class="section-icon">${s.icon}</div>
      <div>
        <div class="section-meta">SECTION ${currentSection+1} OF ${sections.length}</div>
        <h2>${s.title}</h2>
        <p class="sub">${s.sub}</p>
      </div>
    </div>
    <div id="questions"></div>
    <div class="nav-row">
      ${currentSection > 0 ? `<button class="nav-back" id="backBtn">← Back</button>` : ''}
      <button class="nav-next" id="nextBtn" ${allAnswered ? '' : 'disabled'}>
        ${currentSection === sections.length - 1 ? 'Continue →' : 'Next Section →'}
      </button>
    </div>
  `;

  const qContainer = document.getElementById('questions');
  s.questions.forEach((item, qi) => {
    const key = questionKey(currentSection, qi);
    const current = answers[key];
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `
      <p>${item.q}</p>
      <div class="yn-row">
        <button class="yn-btn ${current === true ? 'selected ' + ((item.neg || 'yes') === 'yes' ? 'negative' : 'positive') : ''}" data-val="true">Yes</button>
        <button class="yn-btn ${current === false ? 'selected ' + ((item.neg || 'yes') === 'no' ? 'negative' : 'positive') : ''}" data-val="false">No</button>
      </div>
    `;
    div.querySelectorAll('.yn-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const clickedVal = (btn.dataset.val === 'true');
        answers[key] = (answers[key] === clickedVal) ? undefined : clickedVal;
        if (answers[key] === undefined) delete answers[key];
        renderSection();
      });
    });
    qContainer.appendChild(div);
  });

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { currentSection--; renderSection(); window.scrollTo({top:0, behavior:'smooth'}); });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', () => {
    if (currentSection < sections.length - 1) {
      currentSection++;
      renderSection();
    } else {
      renderContactForm();
    }
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

const contactInfo = {};

function renderContactForm(){
  app.innerHTML = `
    <div class="contact-card">
      <div class="contact-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v2H9z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
      </div>
      <h2>Almost there</h2>
      <p class="sub">Your answers have been recorded. Enter your details to reveal your child's risk profile and receive your personalised report.</p>

      <div class="field-grid">
        <div class="field">
          <label>Your Name <span class="req">*</span></label>
          <input type="text" id="f-parentName" placeholder="Parent / Guardian name" />
        </div>
        <div class="field">
          <label>Child's Name <span class="req">*</span></label>
          <input type="text" id="f-childName" placeholder="Child's first name" />
        </div>
        <div class="field">
          <label>Child's Age <span class="req">*</span></label>
          <input type="number" id="f-childAge" placeholder="e.g. 8" min="0" max="18" />
        </div>
        <div class="field">
          <label>Your Email <span class="req">*</span></label>
          <input type="email" id="f-email" placeholder="your@email.com" />
        </div>
      </div>

      <div class="field-full">
        <label>Phone Number <span class="req">*</span></label>
        <input type="tel" id="f-phone" placeholder="+44 7700 000000" />
      </div>

      <div class="field-full">
        <label>Main concern (optional)</label>
        <textarea id="f-concern" placeholder="Describe your main concern in a few words..."></textarea>
      </div>

      <div class="consent-row">
        <input type="checkbox" id="f-consent" />
        <label for="f-consent">I understand this is a screening tool only and not a diagnosis. A full assessment can only be provided after a clinical consultation.</label>
      </div>

      <div id="formError"></div>

      <button class="nav-next" id="submitBtn">Get My Results &amp; Report →</button>
    </div>
  `;

  document.getElementById('submitBtn').addEventListener('click', () => {
    const parentName = document.getElementById('f-parentName').value.trim();
    const childName = document.getElementById('f-childName').value.trim();
    const childAge = document.getElementById('f-childAge').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const concern = document.getElementById('f-concern').value.trim();
    const consent = document.getElementById('f-consent').checked;

    const errorEl = document.getElementById('formError');

    if (!parentName || !childName || !childAge || !email || !phone) {
      errorEl.innerHTML = `<p class="form-error">Please fill in all required fields.</p>`;
      return;
    }
    if (!consent) {
      errorEl.innerHTML = `<p class="form-error">Please confirm you understand this is a screening tool, not a diagnosis.</p>`;
      return;
    }

    Object.assign(contactInfo, { parentName, childName, childAge, email, phone, concern });
    renderResults();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function renderResults(){
  let score = 0;
  const flagsTrue = {};
  const sectionScores = sections.map(() => 0);

  sections.forEach((s, si) => {
    s.questions.forEach((item, qi) => {
      const val = answers[questionKey(si, qi)];
      if (val === true) {
        score += item.w;
        sectionScores[si] += item.w;
        if (item.flag) flagsTrue[item.flag] = true;
      }
    });
  });

  // combo override: witnessed apnoea + daytime mouth breathing -> force High Risk
  // (mirrors the note on the intro page about high-risk combinations)
  let bandClass, bandLabel, note, overrideText = '';
  const forcedHigh = flagsTrue.apnea && flagsTrue.mouthBreathing;

  if (forcedHigh || score >= 50) {
    bandClass = 'high'; bandLabel = 'High Risk';
    note = "A high number of indicators associated with paediatric sleep-disordered breathing and altered craniofacial development were identified. Prompt professional assessment is recommended.";
    if (forcedHigh) overrideText = "High Risk Override: Witnessed apnoea + Mouth breathing";
  } else if (score >= 30) {
    bandClass = 'moderate'; bandLabel = 'Moderate Risk';
    note = "A number of indicators were identified that warrant a closer look. A comprehensive assessment is recommended.";
  } else if (score >= 15) {
    bandClass = 'mild'; bandLabel = 'Mild Risk';
    note = "A few early indicators were identified. A preventative assessment would likely be beneficial.";
  } else {
    bandClass = 'low'; bandLabel = 'Low Risk';
    note = "Few or no indicators were identified. Continue to monitor your child's breathing and development.";
  }

  const icons = {
    high: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D64545" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>`,
    moderate: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D6A11E" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r="0.6" fill="#D6A11E" stroke="none"/></svg>`,
    mild: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2E9E4F" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`,
    low: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2E9E4F" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`,
  };

  const email = contactInfo.email || 'your email';

  const breakdownHtml = sections.map((s, si) => {
    const pts = sectionScores[si];
    return `
      <div class="breakdown-row">
        <div class="breakdown-left">
          <div class="breakdown-icon">${s.icon}</div>
          <span>${s.title}</span>
        </div>
        <div class="breakdown-points ${pts > 0 ? 'pts-red' : 'pts-green'}">${pts} point${pts === 1 ? '' : 's'}</div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="results-card card-${bandClass}">
      <div class="result-icon-wrap icon-${bandClass}">${icons[bandClass]}</div>
      ${contactInfo.childName ? `<p style="font-size:13px;color:var(--grey-text);margin:0 0 6px;font-weight:700;">${contactInfo.childName}'s Results</p>` : ''}
      <p class="results-score band-${bandClass}">${score}</p>
      <p class="results-outof">weighted score (out of ${totalMaxScore})</p>
      <div class="results-band band-${bandClass}">${bandLabel}</div>
      ${overrideText ? `<p class="result-override band-${bandClass}">${overrideText}</p>` : ''}
      <p class="results-note" style="margin-top:12px;">${note}</p>
    </div>

    <div class="card-block">
      <div class="report-row">
        <div class="report-left">
          <div class="report-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </div>
          <div>
            <p class="report-title">Report Sent to</p>
            <p class="report-email">${email}</p>
          </div>
        </div>
        <a class="resend-link" id="resendLink">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          Resend Report
        </a>
      </div>
      <p class="report-desc">A detailed copy of this assessment has been sent to your email for your records.</p>
      <p class="report-desc">The earlier concerns are identified, the more options may be available to support your child's breathing and development.</p>
    </div>

    <div class="card-block">
      <h3>Your breakdown by section</h3>
      ${breakdownHtml}
    </div>

    <div class="card-block">
      <h3>Risk Grading Scale</h3>
      <p class="card-sub">Your position on the grading scale is highlighted</p>
      <div class="scale-row">
        <div class="scale-seg s-low ${bandClass === 'low' ? 'active' : ''}">Low (0-14)</div>
        <div class="scale-seg s-mild ${bandClass === 'mild' ? 'active' : ''}">Mild (15-29)</div>
        <div class="scale-seg s-moderate ${bandClass === 'moderate' ? 'active' : ''}">Moderate (30-49)</div>
        <div class="scale-seg s-high ${bandClass === 'high' ? 'active' : ''}">High (50+)</div>
      </div>
    </div>

    <div class="card-block">
      <h3>What happens next?</h3>
      <p class="next-desc">Your results have been sent to our team at <b>info@theorthodonticspecialist.co.uk</b>. A member of our team will be in touch to discuss next steps and, where appropriate, arrange a breathing and growth assessment.</p>
      <div class="next-buttons">
        <a class="next-btn primary" href="#book-consultation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Book Consultation
        </a>
        <a class="next-btn" href="tel:+44">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2C9.8 21 3 14.2 3 6a2 2 0 0 1 2-2z"/></svg>
          Call the Clinic
        </a>
        <a class="next-btn" href="mailto:info@theorthodonticspecialist.co.uk">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          Email Us
        </a>
      </div>
    </div>

    <div style="text-align:center;">
      <a class="restart-link" id="restartLink">Start over</a>
    </div>
  `;

  const resendBtn = document.getElementById('resendLink');
  if (resendBtn) resendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    resendBtn.innerHTML = 'Sent!';
  });

  document.getElementById('restartLink').addEventListener('click', () => {
    currentSection = 0;
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(contactInfo).forEach(k => delete contactInfo[k]);
    renderSection();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

renderSection();
</script>
</body>
</html>
