/* section header card */

/* progress bar */
.progress-track{
  height:6px;

  border-radius:999px;
  margin-bottom:20px;

}
.progress-fill{
  height:100%;
  background:var(--coral);

}

/* questions */
.question{
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:14px;
}
.question p{
  margin:0 0 14px;
  font-size:14.5px;
  font-weight:600;
  line-height:1.5;
}
.yn-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.yn-btn{
  padding:13px;
  border-radius:12px;
  border:1.5px solid var(--border);
  background:var(--white);
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
  transition:background .15s, border-color .15s, color .15s;
}
.yn-btn:hover{ border-color:var(--coral); }
.yn-btn.selected{
  border-color:var(--coral);
  color:var(--white);
}
.yn-btn.selected.negative{
  background:#D64545;
  border-color:#D64545;
}
.yn-btn.selected.positive{
  background:#2E9E4F;
  border-color:#2E9E4F;
}

/* nav buttons */
.nav-row{
  display:flex;
  gap:10px;
  margin-top:24px;
}
.nav-back{
  background:var(--white);

  border-radius:999px;
  padding:14px 22px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  color:var(--ink);
}
.nav-next{
  flex:1;
  background:var(--coral);
  color:var(--white);
  border:none;
  border-radius:999px;
  padding:14px 22px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:background .15s;
}
.nav-next:disabled{
  background:#AEC9D8;
  cursor:not-allowed;
}
.nav-next:not(:disabled):hover{ background:var(--coral-dark); }

/* results */
.results-note{
  font-size:13.5px;
  color:var(--grey-text);
  line-height:1.6;
  max-width:440px;
  margin:0 auto;
}
.restart-link{
  display:inline-block;
  margin-top:8px;
  font-size:13px;
  color:var(--coral);
  font-weight:700;

  text-decoration:underline;
}

/* contact-capture form */
.contact-card{
  background:var(--white);
  border-radius:20px;
  padding:36px clamp(20px,4vw,44px);
  box-shadow:0 4px 20px rgba(0,0,0,.05);

}
.contact-icon{

  border-radius:14px;
  background:var(--yellow-bg);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
}
.contact-card h2{ font-family:'Lora', serif; font-size:22px; font-weight:800; margin:0 0 8px; }
.contact-card .sub{

.field-grid{

  text-align:left;

}

}
.field label{

  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.field label .req{ color:#D64545; }
.field input, .field textarea{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  font-family:inherit;
  color:var(--ink);
}
.field input:focus, .field textarea:focus{
  outline:none;
  border-color:var(--coral);
}
.field textarea{ resize:vertical; min-height:80px; }
.field input.invalid{ border-color:#D64545; }
#emailHint{ min-height:24px; }
.field-hint{ font-size:12.5px; line-height:1.5; margin:6px 0 0; color:#8A6300; }
.field-hint.error{ color:#B02E2E; }
.hint-btn{ background:none; border:none; padding:0; font:inherit; font-weight:700; color:var(--coral); text-decoration:underline; cursor:pointer; }

.concern-field{
  background:transparent;
  border:none;
  padding:0;
}
.concern-label{
  display:flex;
  align-items:center;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}
.optional-tag{
  font-weight:500;
  color:var(--grey-text);
  margin-left:4px;
}
.concern-field textarea{
  background:var(--pink-bg);

  border-radius:12px;
  padding:14px 16px;
  font-size:14px;
  font-family:inherit;

}
.concern-field textarea:focus{
  outline:none;
  border-color:var(--coral);

.consent-row{

  align-items:flex-start;

  background:var(--pink-bg);
  border-radius:12px;
  padding:14px 16px;
  text-align:left;
  font-size:13px;
  color:var(--grey-text);
  line-height:1.5;
  margin-bottom:20px;
}
.consent-row input{ margin-top:2px; flex-shrink:0; }
.form-error{
  color:#D64545;
  font-size:13px;
  font-weight:600;
  margin:-10px 0 16px;
  text-align:left;

/* ---- expanded results page ---- */
.result-icon-wrap{
  width:60px; height:60px;
  border-radius:50%;

.resend-link{

.card-block h3{ font-family:'Lora', serif; font-size:16px; font-weight:800; margin:0 0 14px; }
.breakdown-icon{

.next-desc{ font-size:13.5px; color:var(--grey-text); line-height:1.7; margin:0 0 18px; }

.next-buttons{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.next-btn{

  padding:12px 18px;
  border-radius:999px;
  font-weight:700;
  font-size:13.5px;
  text-decoration:none;

  border:1.5px solid var(--border);

}
.next-btn.primary{
  background:var(--coral);

/* ---- symptom summary (no points) ---- */
.summary-card{
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:20px;
  padding:32px clamp(20px,4vw,40px);
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}
.summary-card .result-icon-wrap{ border-color:#296182; }
.summary-card h2{ font-family:'Lora', serif; font-size:22px; font-weight:700; margin:0 0 8px; }
.summary-sub{ font-size:14px; color:var(--grey-text); margin:0 0 20px; }
.rec-box{
  background:var(--yellow-bg);
  border-radius:14px;
  padding:18px 20px;
  text-align:left;
}
.rec-title{ font-size:13px; font-weight:700; color:var(--coral); margin:0 0 6px; letter-spacing:.02em; }
.rec-text{ font-size:14.5px; line-height:1.6; color:var(--ink); margin:0; }
.sym-section{ padding:12px 14px; border-radius:12px; margin-bottom:8px; background:var(--pink-bg); }
.sym-head{ display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:700; margin-bottom:6px; }
.sym-list{ margin:0; padding:0 0 0 48px; }
.sym-list li{ font-size:14px; color:var(--grey-text); line-height:1.6; }
.sym-empty{ font-size:14px; color:var(--grey-text); margin:0; }
</style>

  <h1>Red Flags for Paediatric Sleep Disordered Breathing</h1>
  <p>A simple checklist to help you notice common signs of paediatric sleep disordered breathing (pSDB). This symptom checker is not a diagnosis.</p>

<script>
/* ============================================================
   EMAILJS CONFIG — replace these 3 placeholders with your own
   ------------------------------------------------------------
   1. Create a free account at https://www.emailjs.com
   2. Add an Email Service (Gmail, Outlook, etc.) -> copy its
      Service ID below
   3. Create an Email Template with variables matching the
      templateParams object in sendReportEmail() below -> copy
      its Template ID
   4. Go to Account -> General -> copy your Public Key
   ============================================================ */
const EMAILJS_PUBLIC_KEY  = "rYl0BZayZUBiapZgQ";
const EMAILJS_SERVICE_ID  = "service_ocpndqe";
const EMAILJS_TEMPLATE_ID = "template_6q6ys4f";
const CLINIC_EMAIL = "myoscreening@gmail.com";

if (typeof emailjs !== 'undefined') {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

/* ============================================================
   QUESTIONS
   ------------------------------------------------------------
   q     = the question shown to the parent
   label = the short wording shown on the summary page and email
   neg   = (optional) which answer counts as "noticed". Defaults to
           "yes". Set neg:"no" on a question where answering No is
           the concerning answer.
   ============================================================ */

const sections = [
  {
    title: "Sleep Behaviour",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z"/></svg>`,
    questions: [
      { q: "Does your child snore loudly (louder than breathing, audible outside the room)?", label: "Loud snoring" },
      { q: "Have you ever observed your child stop breathing, gasp, or choke during sleep?", label: "Stops breathing, gasps or chokes during sleep" },
      { q: "Does your child sleep with their mouth open?", label: "Sleeps with mouth open" },
      { q: "Does your child sweat excessively during sleep?", label: "Sweats excessively during sleep" },
      { q: "Does your child have restless, unsettled sleep (frequent position changes, falls out of bed)?", label: "Restless, unsettled sleep" },
      { q: "Does your child have frequent night terrors or sleepwalking?", label: "Night terrors or sleepwalking" },
      { q: "Does your child grind or clench their teeth at night (bruxism)?", label: "Grinds or clenches teeth at night" },
      { q: "Do you find your child sleeping with a hyperextended neck?", label: "Sleeps with a hyperextended neck" },
      { q: "Does your child have low energy or daytime fatigue?", label: "Low energy or daytime fatigue" },
      { q: "Did your child bedwet for a long time or still does (enuresis)?", label: "Bedwetting (enuresis)" },
    ]
  },
  {
    title: "Daytime Behaviour & Functioning",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    questions: [
      { q: "Does your child appear tired or difficult to wake in the morning despite a full night's sleep?", label: "Tired or hard to wake despite a full night's sleep" },
      { q: "Does your child have difficulty concentrating, is easily distracted, or has been assessed for ADHD?", label: "Difficulty concentrating, easily distracted, or assessed for ADHD" },
      { q: "Does your child have frequent mood changes, irritability, or behavioural concerns?", label: "Frequent mood changes, irritability or behavioural concerns" },
      { q: "Is your child falling asleep at school or during quiet daytime activities?", label: "Falls asleep at school or during quiet activities" },
      { q: "Does your child have poor school performance or learning difficulties?", label: "Poor school performance or learning difficulties" },
      { q: "Does your child look sad generally and is grumpy a lot?", label: "Often looks sad or grumpy" },
    ]
  },
  {
    title: "Breathing & Sleep Health",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M6 4v5a4 4 0 0 0 8 0V4"/><path d="M10 15v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="1.5"/></svg>`,
    questions: [
      { q: "Does your child breathe through their mouth during the day?", label: "Breathes through the mouth during the day" },
      { q: "Does your child struggle to keep the lips together?", label: "Struggles to keep lips together" },
      { q: "Does your child have a persistently blocked nose, chronic allergies, or hay fever?", label: "Blocked nose, chronic allergies or hay fever" },
      { q: "Has your child been told they have enlarged tonsils or adenoids?", label: "Told they have enlarged tonsils or adenoids" },
      { q: "When your child opens wide, sticks their tongue out and says \"ahhh\", can you clearly see the back of the throat?", label: "Back of the throat hard to see when saying \"ahhh\"", neg: "no" },
      { q: "Does your child have frequent ear infections or glue ear (otitis media with effusion)?", label: "Frequent ear infections or glue ear" },
      { q: "Does your child have recurrent throat infections or tonsillitis?", label: "Recurrent throat infections or tonsillitis" },
    ]
  },
  {
    title: "Facial & Dental Development",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M12 3c-3 0-5 2-5 5 0 3 1 4 1 7 0 2 1 3 2 3s1.5-2 2-2 1.5 2 2 2 2-1 2-3c0-3 1-4 1-7 0-3-2-5-5-5z"/></svg>`,
    questions: [
      { q: "Does your child have crowded, crooked or misaligned teeth?", label: "Crowded, crooked or misaligned teeth" },
      { q: "Does your child have a narrow or high-arched palate?", label: "Narrow or high-arched palate" },
      { q: "Does your child have a significant overbite, overjet (buck teeth), underbite, or crossbite?", label: "Significant overbite, overjet, underbite or crossbite" },
      { q: "Does your child have a long, narrow face or a recessed lower jaw?", label: "Long, narrow face or recessed lower jaw" },
      { q: "Has your child had or been referred for orthodontic treatment involving extractions?", label: "Had or referred for orthodontic treatment with extractions" },
      { q: "Does your child have facial asymmetries (nostrils, eyes, cheeks, chin) or imbalances?", label: "Facial asymmetries or imbalances" },
      { q: "Does your child have black circles under the eyes?", label: "Dark circles under the eyes" },
      { q: "Is your child's profile concave or very convex?", label: "Concave or very convex profile" },
    ]
  },
  {
    title: "Tongue & Swallowing Function",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M6 4h12v6a6 6 0 0 1-12 0V4z"/><path d="M9 20c0-2 1.5-3.5 3-3.5s3 1.5 3 3.5"/></svg>`,
    questions: [
      { q: "Does your child have a tongue thrust (tongue pushes between the teeth when swallowing or speaking)?", label: "Tongue thrust when swallowing or speaking" },
      { q: "Does your child have a lisp or difficulty with certain speech sounds (e.g. S, SH, TH)?", label: "Lisp or difficulty with certain speech sounds" },
      { q: "Has your child been seen by a speech and language therapist?", label: "Seen by a speech and language therapist" },
      { q: "Did your child have difficulties breastfeeding or was tongue tie (ankyloglossia) suspected?", label: "Breastfeeding difficulties or suspected tongue tie" },
      { q: "Does your child prefer soft foods or avoid hard textures?", label: "Prefers soft foods or avoids hard textures" },
    ]
  },
  {
    title: "Habits & History",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v2H9z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>`,
    questions: [
      { q: "Has your child used a dummy/pacifier beyond age 3?", label: "Used a dummy/pacifier beyond age 3" },
      { q: "Does your child suck their thumb or fingers?", label: "Sucks thumb or fingers" },
      { q: "Does your child have frequent headaches or morning headaches?", label: "Frequent or morning headaches" },
      { q: "Does your child have a family history of sleep apnoea or snoring?", label: "Family history of sleep apnoea or snoring" },
    ]
  }
];


let currentSection = 0;
const answers = {}; // key: "sectionIdx-questionIdx" -> true/false

const app = document.getElementById('app');

function questionKey(si, qi){ return si + '-' + qi; }

function renderSection(){
  const s = sections[currentSection];
  const answeredCount = s.questions.filter((_, qi) => answers[questionKey(currentSection, qi)] !== undefined).length;
  const allAnswered = answeredCount === s.questions.length;
  const progressPct = ((currentSection) / sections.length) * 100 + (100/sections.length) * (answeredCount / s.questions.length);

  app.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="section-head">
      <div class="section-icon">${s.icon}</div>
      <div>
        <div class="section-meta">SECTION ${currentSection+1} OF ${sections.length}</div>
        <h2>${s.title}</h2>
        <p class="sub">${s.sub}</p>
      </div>
    </div>
    <div id="questions"></div>
    <div class="nav-row">
      ${currentSection > 0 ? `<button class="nav-back" id="backBtn">← Back</button>` : ''}
      <button class="nav-next" id="nextBtn" ${allAnswered ? '' : 'disabled'}>
        ${currentSection === sections.length - 1 ? 'Continue →' : 'Next Section →'}
      </button>
    </div>
  `;

  const qContainer = document.getElementById('questions');
  s.questions.forEach((item, qi) => {
    const key = questionKey(currentSection, qi);
    const current = answers[key];
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `
      <p>${item.q}</p>
      <div class="yn-row">
        <button class="yn-btn ${current === true ? 'selected ' + ((item.neg || 'yes') === 'yes' ? 'negative' : 'positive') : ''}" data-val="true">Yes</button>
        <button class="yn-btn ${current === false ? 'selected ' + ((item.neg || 'yes') === 'no' ? 'negative' : 'positive') : ''}" data-val="false">No</button>
      </div>
    `;
    div.querySelectorAll('.yn-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const clickedVal = (btn.dataset.val === 'true');
        answers[key] = (answers[key] === clickedVal) ? undefined : clickedVal;
        if (answers[key] === undefined) delete answers[key];
        renderSection();
      });
    });
    qContainer.appendChild(div);
  });

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { currentSection--; renderSection(); window.scrollTo({top:0, behavior:'smooth'}); });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', () => {
    if (currentSection < sections.length - 1) {
      currentSection++;
      renderSection();
    } else {
      renderContactForm();
    }
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

const contactInfo = {};

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- name formatting ----------
   "SARAH o'brien-SMITH" -> "Sarah O'Brien-Smith"
   Words typed in deliberate mixed case that already start with a
   capital (e.g. "McDonald", "DeVries") are left as typed. */
function formatName(raw){
  return raw.trim().replace(/\s+/g, ' ').split(' ').map(word =>
    word.split(/([-'’])/).map(part => {
      if (!part || /^[-'’]$/.test(part)) return part;
      const isMixed = part !== part.toLowerCase() && part !== part.toUpperCase();
      if (isMixed && part[0] === part[0].toUpperCase()) return part;
      return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
    }).join('')
  ).join(' ');
}

/* ---------- email checking ---------- */
const COMMON_DOMAINS = ['gmail.com','outlook.com','hotmail.com','live.com','yahoo.com','icloud.com','me.com',
  'bigpond.com','bigpond.net.au','optusnet.com.au','live.com.au','hotmail.com.au','outlook.com.au','yahoo.com.au',
  'tpg.com.au','iinet.net.au','internode.on.net','westnet.com.au','aapt.net.au'];

function editDistance(a, b){
  const d = Array.from({length:a.length+1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

// Returns { ok:false, msg } if the address can't be right,
// { ok:true, suggestion } if it looks like a typo of a common provider,
// or { ok:true } if it looks fine.
function checkEmail(raw){
  const email = raw.trim().toLowerCase();
  if (!email) return { ok:false, msg:'Please enter your email address.' };
  if (/\s/.test(email)) return { ok:false, msg:'Your email address can\'t contain spaces.' };
  const at = email.split('@');
  if (at.length !== 2) return { ok:false, msg:'Your email address needs exactly one "@" sign.' };
  const [local, domain] = at;
  if (!local || !/^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(local) || /^\.|\.$|\.\./.test(local))
    return { ok:false, msg:'Please check the part of your email before the "@".' };
  // fix common ending typos first: .con -> .com, .com.a -> .com.au
  let fixed = domain
    .replace(/\.(con|cmo|ocm|vom|xom|comm|cpm)$/, '.com')
    .replace(/\.com\.(a|aus|ua)$/, '.com.au')
    .replace(/\.net\.(a|aus|ua)$/, '.net.au');
  if (!COMMON_DOMAINS.includes(fixed)) {
    let best = null, bestDist = 3;
    for (const d of COMMON_DOMAINS) {
      const dist = editDistance(fixed, d);
      if (dist < bestDist) { best = d; bestDist = dist; }
    }
    if (best && bestDist <= 2 && fixed.length > 5) fixed = best;
  }
  const validDomain = d => /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/.test(d);
  if (!validDomain(fixed))
    return { ok:false, msg:'Please check the part of your email after the "@" (e.g. gmail.com).' };
  if (fixed !== domain) return { ok:true, email, suggestion: local + '@' + fixed };
  return { ok:true, email };
}

function renderContactForm(){
  app.innerHTML = `
    <div class="contact-card">
      <div class="contact-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v2H9z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
      </div>
      <h2>Almost there</h2>
      <p class="sub">Your answers have been recorded. Enter your details to see a summary of the signs you noticed and receive a copy by email.</p>

      <div class="field-grid">
        <div class="field">
          <label>Your Name <span class="req">*</span></label>
          <input type="text" id="f-parentName" placeholder="Parent / Guardian name" autocomplete="name" autocapitalize="words" />
        </div>
        <div class="field">
          <label>Child's Name <span class="req">*</span></label>
          <input type="text" id="f-childName" placeholder="Child's first name" autocomplete="off" autocapitalize="words" />
        </div>
        <div class="field">
          <label>Child's Age <span class="req">*</span></label>
          <input type="number" id="f-childAge" placeholder="e.g. 8" min="4" max="17" />
        </div>
        <div class="field">
          <label>Your Email <span class="req">*</span></label>
          <input type="email" id="f-email" placeholder="your@email.com" autocomplete="email" />
          <div id="emailHint"></div>
        </div>
      </div>

      <div class="field-full concern-field">
        <label class="concern-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.4 0-2.7-.3-3.9-.9L3 20l1-4.9A8.5 8.5 0 1 1 21 11.5z"/></svg>
          Main concern <span class="optional-tag">(optional)</span>
        </label>
        <textarea id="f-concern" placeholder="e.g. My child snores loudly and seems tired all the time..."></textarea>
      </div>

      <div class="consent-row">
        <input type="checkbox" id="f-consent" />
        <label for="f-consent">I understand this is a symptom checker only and not a diagnosis. A full assessment can only be provided after a clinical consultation.</label>
      </div>

      <div id="formError"></div>

      <button class="nav-next" id="submitBtn">Get My Results &amp; Report →</button>
    </div>
  `;

  const parentInput = document.getElementById('f-parentName');
  const childInput  = document.getElementById('f-childName');
  const emailInput  = document.getElementById('f-email');
  const emailHint   = document.getElementById('emailHint');
  let suggestionShownFor = null;   // lets a parent keep an unusual-but-real address on a second click

  // tidy names as soon as the parent leaves the box
  [parentInput, childInput].forEach(inp =>
    inp.addEventListener('blur', () => { inp.value = formatName(inp.value); }));

  function showEmailCheck(result){
    emailInput.classList.toggle('invalid', !result.ok);
    if (!result.ok) {
      emailHint.innerHTML = `<p class="field-hint error">${esc(result.msg)}</p>`;
    } else if (result.suggestion) {
      emailHint.innerHTML = `<p class="field-hint">Did you mean <b>${esc(result.suggestion)}</b>? <button type="button" class="hint-btn" id="useSuggestion">Yes, fix it</button></p>`;
      document.getElementById('useSuggestion').addEventListener('click', () => {
        emailInput.value = result.suggestion;
        emailHint.innerHTML = '';
        emailInput.classList.remove('invalid');
      });
    } else {
      emailHint.innerHTML = '';
    }
  }
  emailInput.addEventListener('blur', () => { if (emailInput.value.trim()) showEmailCheck(checkEmail(emailInput.value)); });
  emailInput.addEventListener('input', () => { emailInput.classList.remove('invalid'); emailHint.innerHTML = ''; });

  document.getElementById('submitBtn').addEventListener('click', () => {
    parentInput.value = formatName(parentInput.value);
    childInput.value = formatName(childInput.value);
    const parentName = parentInput.value;
    const childName = childInput.value;
    const childAge = document.getElementById('f-childAge').value.trim();
    const email = emailInput.value.trim();
    const concern = document.getElementById('f-concern').value.trim();
    const consent = document.getElementById('f-consent').checked;

    const errorEl = document.getElementById('formError');

    if (!parentName || !childName || !childAge || !email) {
      errorEl.innerHTML = `<p class="form-error">Please fill in all required fields.</p>`;
      return;
    }
    const ageNum = Number(childAge);
    if (!Number.isInteger(ageNum) || ageNum < 4 || ageNum > 17) {
      errorEl.innerHTML = `<p class="form-error">This symptom checker is designed for children aged 4–17. Please enter an age in that range.</p>`;
      return;
    }
    const emailCheck = checkEmail(email);
    if (!emailCheck.ok) {
      showEmailCheck(emailCheck);
      errorEl.innerHTML = `<p class="form-error">Please check your email address so we can send your summary.</p>`;
      emailInput.focus();
      return;
    }
    if (emailCheck.suggestion && suggestionShownFor !== emailCheck.email) {
      suggestionShownFor = emailCheck.email;
      showEmailCheck(emailCheck);
      errorEl.innerHTML = `<p class="form-error">Please double-check your email address. If it's correct, press the button again.</p>`;
      return;
    }
    emailInput.value = emailCheck.email;
    if (!consent) {
      errorEl.innerHTML = `<p class="form-error">Please confirm you understand this is a symptom checker, not a diagnosis.</p>`;
      return;
    }

    Object.assign(contactInfo, { parentName, childName, childAge, email: emailCheck.email, concern });

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending your report...';

    sendReportEmail()
      .then(() => { lastEmailStatus = 'success'; })
      .catch(() => { lastEmailStatus = 'error'; })
      .finally(() => {
        renderResults();
        window.scrollTo({top:0, behavior:'smooth'});
      });
  });
}

function isNoticed(item, val){
  const concerning = (item.neg || 'yes') === 'yes';
  return concerning ? val === true : val === false;
}

function computeResults(){
  const bySection = sections.map((s, si) => ({
    title: s.title,
    icon: s.icon,
    items: s.questions
      .filter((item, qi) => isNoticed(item, answers[questionKey(si, qi)]))
      .map(item => item.label || item.q)
  })).filter(sec => sec.items.length > 0);
  const total = bySection.reduce((n, sec) => n + sec.items.length, 0);
  return { bySection, total };
}

function buildSymptomsText(bySection){
  if (!bySection.length) return 'No signs were reported.';
  return bySection.map(sec => sec.title + '\n' + sec.items.map(i => '  - ' + i).join('\n')).join('\n\n');
}

function buildSymptomsHtml(bySection){
  if (!bySection.length) return '<p style="margin:0;">No signs were reported.</p>';
  return bySection.map(sec =>
    '<p style="margin:0 0 4px; font-weight:bold; color:#1A1F23;">' + esc(sec.title) + '</p>' +
    '<ul style="margin:0 0 12px; padding-left:20px;">' +
      sec.items.map(i => '<li style="margin:0 0 2px;">' + esc(i) + '</li>').join('') +
    '</ul>'
  ).join('');
}

const RECOMMENDATION = "We recommend booking an appointment with your GP or a qualified health practitioner to talk through these signs. Bring this summary with you — it will help them understand what you've noticed.";
const RECOMMENDATION_NONE = "You didn't report any of the signs we asked about. If you still have concerns about your child's breathing, sleep or development, it's always worth speaking with your GP or a qualified health practitioner.";

let lastEmailStatus = null; // 'success' | 'error' | null

function sendReportEmail(){
  if (typeof emailjs === 'undefined' || EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
    return Promise.reject(new Error('EmailJS not configured'));
  }
  const r = computeResults();
  const templateParams = {
    to_email: contactInfo.email || CLINIC_EMAIL,   // the parent who filled in the form
    clinic_email: CLINIC_EMAIL,                    // put {{clinic_email}} in the template's Bcc field
    parent_name: contactInfo.parentName || '',
    child_name: contactInfo.childName || '',
    child_age: contactInfo.childAge || '',
    parent_email: contactInfo.email || '',
    main_concern: contactInfo.concern || '(not provided)',
    symptom_count: r.total,
    symptoms_list: buildSymptomsText(r.bySection),   // plain-text fallback
    symptoms_html: buildSymptomsHtml(r.bySection),   // use {{{symptoms_html}}} in the template
    recommendation: r.total ? RECOMMENDATION : RECOMMENDATION_NONE,
    submitted_at: new Date().toLocaleString(),
  };
  return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
}

function renderResults(){
  const r = computeResults();
  const email = esc(contactInfo.email || 'your email');
  const who = contactInfo.childName ? esc(contactInfo.childName) + "'s" : "Your child's";

  const symptomsHtml = r.total ? r.bySection.map(sec => `
      <div class="sym-section">
        <div class="sym-head">
          <div class="breakdown-icon">${sec.icon}</div>
          <span>${sec.title}</span>
        </div>
        <ul class="sym-list">
          ${sec.items.map(i => `<li>${i}</li>`).join('')}
        </ul>
      </div>`).join('')
    : `<p class="sym-empty">You answered "No" to every question.</p>`;

  app.innerHTML = `
    <div class="summary-card">
      <div class="result-icon-wrap" style="color:#296182;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v2H9z"/><path d="M9 13l2 2 4-4"/></svg>
      </div>
      <h2>${who} symptom checker summary</h2>
      <p class="summary-sub">${r.total
        ? `You noticed <b>${r.total}</b> of the signs we asked about. They're listed below.`
        : `You didn't report any of the signs we asked about.`}</p>
      <div class="rec-box">
        <p class="rec-title">Our recommendation</p>
        <p class="rec-text">${r.total ? RECOMMENDATION : RECOMMENDATION_NONE}</p>
      </div>
      <p class="results-note" style="margin-top:14px;">This is a symptom checker only — it doesn't diagnose any condition. A diagnosis can only be made after a clinical examination.</p>
    </div>

    <div class="card-block">
      <h3>Signs you noticed</h3>
      ${symptomsHtml}
    </div>

    <div class="card-block">
      <div class="report-row">
        <div class="report-left">
          <div class="report-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </div>
          <div>
            <p class="report-title">${lastEmailStatus === 'success' ? 'Summary Sent to' : 'Summary Not Sent'}</p>
            ${lastEmailStatus === 'success' ? `<p class="report-email">${email}</p>` : `<p class="report-email" style="color:#B02E2E;">We couldn't send your summary automatically. Please contact us directly.</p>`}
          </div>
        </div>
        <a class="resend-link" id="resendLink" href="#" role="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <span id="resendLabel">Resend Summary</span>
        </a>
      </div>
      <p class="report-desc">${lastEmailStatus === 'success' ? "A copy of this summary has been sent to your email so you can take it to your appointment." : "If this keeps happening, please email us directly using the button below."}</p>
    </div>

    <div class="card-block">
      <h3>What happens next?</h3>
      <p class="next-desc">A copy of your summary has also been shared with our team at <b>myoscreening@gmail.com</b>. If you have questions about any of the signs above, you're welcome to get in touch.</p>
      <div class="next-buttons">
        <a class="next-btn primary" href="mailto:myoscreening@gmail.com">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          Email Us
        </a>
        <a class="next-btn" href="index.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#296182" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
          Learn about the signs
        </a>
      </div>
    </div>

    <div style="text-align:center;">
      <a class="restart-link" id="restartLink" href="#" role="button">Start over</a>
    </div>
  `;

  const resendBtn = document.getElementById('resendLink');
  if (resendBtn) resendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const label = document.getElementById('resendLabel');
    label.textContent = 'Sending...';
    sendReportEmail()
      .then(() => {
        lastEmailStatus = 'success';
        label.textContent = 'Sent!';
        setTimeout(() => renderResults(), 900);
      })
      .catch(() => {
        lastEmailStatus = 'error';
        label.textContent = 'Failed — try again';
      });
  });

  document.getElementById('restartLink').addEventListener('click', (e) => {
    e.preventDefault();
    currentSection = 0;
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(contactInfo).forEach(k => delete contactInfo[k]);
    renderSection();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

renderSection();
</script>
