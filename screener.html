<style>
.wrap{max-width:680px;margin:0 auto;padding:40px 20px 88px}
.page-kicker{margin:0 0 20px}

/* progress */
.progress{display:flex;gap:4px;margin-bottom:10px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.progress span i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transition:transform .25s ease}
.section-meta{margin:0 0 6px;font-size:14px;color:var(--muted)}
.section-head h1{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,34px);line-height:1.15;letter-spacing:-.01em}
.section-head .sub{margin:0 0 8px;font-size:15px;color:var(--muted)}

/* questions */
.question{border:0;margin:0;padding:20px 0;border-bottom:1px solid var(--line);min-width:0}
.question legend{float:left;width:100%;padding:0;margin:0 0 12px;font-size:16px;line-height:1.5;font-weight:500}
.yn-row{clear:both;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn-btn{min-height:48px;border-radius:6px;border:1px solid var(--control);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer;color:var(--ink);transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.yn-btn:hover{border-color:var(--ink)}
/* selected answer: red if it points to a sign, green if it doesn't */
.yn-btn.selected.negative{background:#C43C3C;border-color:#C43C3C;color:#fff}
.yn-btn.selected.positive{background:#27803F;border-color:#27803F;color:#fff}

/* nav */
.nav-row{display:flex;gap:10px;margin-top:28px}
.nav-back{display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:0 18px;background:var(--surface);border:1px solid var(--control);border-radius:6px;font-weight:600;font-size:16px;cursor:pointer;color:var(--ink);transition:border-color .15s ease}
.nav-back:hover{border-color:var(--ink)}
.nav-next{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;background:var(--accent);color:#fff;border:0;border-radius:6px;font-weight:600;font-size:16px;cursor:pointer;font-family:inherit;transition:background-color .15s ease}
.nav-next:not(:disabled):hover{background:var(--accent-dark)}
.nav-next:disabled{background:#B9C9BF;cursor:not-allowed}
.nav-hint{margin:10px 0 0;font-size:14px;color:var(--muted);text-align:center}

/* contact form */
.contact-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:32px clamp(20px,4vw,40px)}
.contact-card h1{margin:0 0 8px;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15}
.contact-card .sub{margin:0 0 28px;font-size:16px;line-height:1.6;color:var(--body)}
.contact-icon{display:none}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin-bottom:18px}
@media (max-width:520px){ .field-grid{grid-template-columns:1fr} }
.field label,.concern-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field label .req{color:var(--error)}
.field input,.concern-field textarea{width:100%;min-height:48px;border:1px solid var(--control);border-radius:6px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--surface);transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus,.concern-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,107,87,.18)}
.field input.invalid{border-color:var(--error)}
#emailHint{min-height:24px}
.field-hint{font-size:13.5px;line-height:1.5;margin:6px 0 0;color:#7A5A00}
.field-hint.error{color:var(--error)}
.hint-btn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;cursor:pointer}
.concern-field{margin-bottom:18px}
.concern-label{display:flex;align-items:center}
.concern-label svg{display:none}
.optional-tag{font-weight:400;color:var(--muted);margin-left:4px}
.concern-field textarea{min-height:96px;resize:vertical}
.concern-field textarea::placeholder,.field input::placeholder{color:#8C958F}
.consent-row{display:flex;align-items:flex-start;gap:12px;background:var(--bg);border:1px solid var(--line-soft);border-radius:6px;padding:14px 16px;font-size:14.5px;color:var(--body);line-height:1.55;margin-bottom:20px}
.consent-row input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.privacy-note{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px;margin:4px 0 14px;font-size:14.5px;line-height:1.55;color:var(--body)}
.privacy-note .privacy-title{margin:0 0 6px;font-weight:600;color:var(--ink)}
.privacy-note ul{margin:0 0 8px;padding-left:18px}
.privacy-note li{margin-bottom:4px}
.privacy-note .privacy-more{margin:0}
.consent-row + .consent-row{margin-top:-10px}
.recaptcha-box:not(:empty){margin:0 0 18px}
.form-error{color:var(--error);font-size:14px;font-weight:600;margin:-6px 0 16px}
.skip-row{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.skip-btn{background:none;border:0;padding:6px 4px;min-height:44px;font:inherit;font-size:15px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.skip-note{font-size:13.5px;color:var(--muted);margin:2px 0 0}

/* results */
.results-head h1{margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.5vw,38px);line-height:1.12;letter-spacing:-.01em}
.results-head .summary-sub{margin:0 0 20px;font-size:16px;color:var(--body)}
.rec-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:12px}
.rec-box .kicker{margin-bottom:6px}
.rec-box p.rec-text{margin:0;font-size:16px;line-height:1.6;color:var(--ink)}
.results-note{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 28px}
.sym-sec{margin-bottom:18px}
.sym-sec-title{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--muted)}
.sym-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.sym-list li{padding:14px 16px;border-top:1px solid var(--line-soft);font-size:16px;font-weight:500;line-height:1.45}
.sym-list li:first-child{border-top:0}
.sym-empty{font-size:16px;color:var(--body);margin:0}
.card-block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px clamp(20px,4vw,28px);margin-top:16px}
.card-block h3{margin:0 0 8px;font-family:var(--serif);font-weight:500;font-size:22px}
.next-desc{font-size:15px;color:var(--body);line-height:1.65;margin:0 0 18px}
.next-desc b{color:var(--ink)}
.next-buttons{display:flex;flex-wrap:wrap;gap:10px}
.next-buttons .btn{flex:1 1 auto}
.report-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.report-title{font-size:15px;font-weight:600;margin:0 0 2px}
.report-email{font-size:15px;color:var(--body);word-break:break-all;margin:0}
.resend-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.resend-link:hover{text-decoration:underline}
.report-desc{font-size:14px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.restart-row{text-align:center;margin-top:20px}
.restart-link{display:inline-flex;align-items:center;min-height:44px;font-size:15px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.section-heading{margin:0 0 12px;font-family:var(--serif);font-weight:500;font-size:24px}

/* swapping steps */
#app.fade-in{animation:stepIn .22s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.contact-card .nav-next{width:100%}
</style>

<script>
/* ============================================================

   1. Create a free account at https://www.emailjs.com
   2. Add an Email Service (Gmail, Outlook, etc.) -> copy its
      Service ID below
   3. Create an Email Template with variables matching the
      templateParams object in sendReportEmail() below -> copy
      its Template ID
   4. Go to Account -> General -> copy your Public Key
   ============================================================ */
const EMAILJS_PUBLIC_KEY  = "rYl0BZayZUBiapZgQ";
const EMAILJS_SERVICE_ID  = "service_ocpndqe";
const EMAILJS_TEMPLATE_ID = "template_6q6ys4f";
const CLINIC_EMAIL = "myoscreening@gmail.com";

/* ============================================================
   reCAPTCHA (stops people using your EmailJS keys directly)
   ------------------------------------------------------------
   1. Go to https://www.google.com/recaptcha/admin and register
      a new site: type "reCAPTCHA v2" -> "I'm not a robot" checkbox.
      Add your site's domain (e.g. yourname.github.io).
   2. Paste the SITE key below.
   3. In EmailJS: Email Templates -> your template -> Settings ->
      tick "Enable reCAPTCHA V2 verification" and paste the
      SECRET key there.
   Leave the site key empty ("") to switch the checkbox off.
   ============================================================ */
const RECAPTCHA_SITE_KEY = "6LeFOustAAAAAIYJYFw-FnnpTEmlzPVhfye9NfNL";

if (typeof emailjs !== 'undefined') {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

let recaptchaWidget = null;
function mountRecaptcha(){
  const box = document.getElementById('recaptchaBox');
  if (!RECAPTCHA_SITE_KEY || !box) return;
  if (window.grecaptcha && window.grecaptcha.render) {
    recaptchaWidget = window.grecaptcha.render(box, { sitekey: RECAPTCHA_SITE_KEY });
  } else {
    window.__mountRecaptcha = mountRecaptcha;   // runs when Google's script finishes loading
  }
}
window.onRecaptchaLoad = () => { if (window.__mountRecaptcha) window.__mountRecaptcha(); };
if (RECAPTCHA_SITE_KEY) {
  const s = document.createElement('script');
  s.src = 'https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}
function recaptchaToken(){
  if (!RECAPTCHA_SITE_KEY) return null;
  try { return window.grecaptcha ? window.grecaptcha.getResponse(recaptchaWidget) : ''; } catch(e) { return ''; }
}

/* ============================================================
   QUESTIONS
   ------------------------------------------------------------
   q     = the question shown to the parent
   label = the short wording shown on the summary page and email
   neg   = (optional) which answer counts as "noticed". Defaults to
           "yes". Set neg:"no" on a question where answering No is
           the concerning answer.
   sign  = (optional) which of the 21 signs in signs.js this links to.
           Adds an ⓘ beside it on the summary page.
   info  = (optional) the "What to look for" panel opened by the ⓘ
           beside the question. title, tips (list) and img (optional).
   ============================================================ */

const sections = [
  {
    title: "Sleep Behaviour",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D6B57" stroke-width="2"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z"/></svg>`,
    questions: [
      { q: "Does your child snore loudly (louder than breathing, audible outside the room)?", label: "Loud snoring", sign: "snoring",
        info: {"title": "Loud snoring", "img": "images/snoring.jpg", "tips": ["Listen from outside your child’s bedroom while they sleep.", "Answer Yes if you can hear snoring on most nights — not just when they have a cold."]} },
      { q: "Have you ever observed your child stop breathing, gasp, or choke during sleep?", label: "Stops breathing, gasps or chokes during sleep",
        info: {"title": "Pauses, gasps or choking in sleep", "tips": ["Look for breathing that stops for a few seconds, then restarts with a gasp, snort or cough.", "You may also notice the chest or tummy working hard, or your child waking suddenly.", "Answer Yes if you have ever seen this happen."]} },
      { q: "Does your child sleep with their mouth open?", label: "Sleeps with mouth open", sign: "mouth-breathing" },
      { q: "Does your child sweat excessively during sleep?", label: "Sweats excessively during sleep", sign: "night-sweats" },
      { q: "Does your child have restless, unsettled sleep (frequent position changes, falls out of bed)?", label: "Restless, unsettled sleep" },
      { q: "Does your child have frequent night terrors or sleepwalking?", label: "Night terrors or sleepwalking", sign: "night-terrors" },
      { q: "Does your child grind or clench their teeth at night (bruxism)?", label: "Grinds or clenches teeth at night", sign: "teeth-grinding" },
      { q: "Do you find your child sleeping with a hyperextended neck?", label: "Sleeps with a hyperextended neck", sign: "body-posture",
        info: {"title": "Sleeping with the neck stretched back", "tips": ["Check on your child while they’re asleep.", "Answer Yes if their head is often tipped right back with the chin pointing up, as if they’re stretching to breathe."]} },
      { q: "Does your child have low energy or daytime fatigue?", label: "Low energy or daytime fatigue" },
      { q: "Did your child bedwet for a long time or still does (enuresis)?", label: "Bedwetting (enuresis)", sign: "bedwetting",
        info: {"title": "Bedwetting", "img": "images/bedwetting.jpg", "tips": ["Think about regular bedwetting after about age 5.", "Answer Yes if it went on for a long time, or still happens now."]} },
    ]
  },
  {
    title: "Daytime Behaviour & Functioning",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D6B57" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
    questions: [
      { q: "Does your child appear tired or difficult to wake in the morning despite a full night's sleep?", label: "Tired or hard to wake despite a full night's sleep" },
      { q: "Does your child have difficulty concentrating, is easily distracted, or has been assessed for ADHD?", label: "Difficulty concentrating, easily distracted, or assessed for ADHD", sign: "adhd-like-symptoms" },
      { q: "Does your child have frequent mood changes, irritability, or behavioural concerns?", label: "Frequent mood changes, irritability or behavioural concerns" },
      { q: "Is your child falling asleep at school or during quiet daytime activities?", label: "Falls asleep at school or during quiet activities" },
      { q: "Does your child have poor school performance or learning difficulties?", label: "Poor school performance or learning difficulties", sign: "learning-difficulties" },
      { q: "Does your child look sad generally and is grumpy a lot?", label: "Often looks sad or grumpy" },
    ]
  },
  {
    title: "Breathing & Sleep Health",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D6B57" stroke-width="2"><path d="M6 4v5a4 4 0 0 0 8 0V4"/><path d="M10 15v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="1.5"/></svg>`,
    questions: [
      { q: "Does your child breathe through their mouth during the day?", label: "Breathes through the mouth during the day", sign: "mouth-breathing",
        info: {"title": "Breathing through the mouth", "img": "images/mouth-breathing.jpg", "tips": ["Watch your child when they’re relaxed — watching TV, reading or concentrating.", "Answer Yes if their lips are apart and they’re breathing through the mouth most of the time.", "Mouth breathing only while they have a cold doesn’t count."]} },
      { q: "Does your child struggle to keep the lips together?", label: "Struggles to keep lips together", sign: "mouth-breathing",
        info: {"title": "Keeping the lips together", "tips": ["At rest, are your child’s lips gently closed without any effort?", "Signs of strain include a tight, dimpled chin when the lips are closed, or lips that keep drifting apart.", "Answer Yes if they often rest with their lips apart."]} },
      { q: "Does your child have a persistently blocked nose, chronic allergies, or hay fever?", label: "Blocked nose, chronic allergies or hay fever", sign: "allergies" },
      { q: "Has your child been told they have enlarged tonsils or adenoids?", label: "Told they have enlarged tonsils or adenoids", sign: "enlarged-tonsils" },
      { q: "When your child opens wide, sticks their tongue out and says \"ahhh\", can you clearly see the back of the throat?", label: "Back of the throat hard to see when saying \"ahhh\"", neg: "no", sign: "enlarged-tonsils",
        info: {"title": "Seeing the back of the throat", "img": "images/enlarged-tonsils.jpg", "tips": ["Use a torch, and ask your child to open wide and stick their tongue right out.", "Answer Yes if you can clearly see the back wall of the throat.", "Answer No if large tonsils or the tongue block most of the view."]} },
      { q: "Does your child have frequent ear infections or glue ear (otitis media with effusion)?", label: "Frequent ear infections or glue ear", sign: "ear-infections",
        info: {"title": "Ear infections and glue ear", "img": "images/ear-infections.jpg", "tips": ["Glue ear is a build-up of fluid behind the eardrum that can muffle hearing.", "Count ear infections treated by a doctor, or grommets being fitted.", "Answer Yes if infections happen several times a year, or glue ear has been diagnosed."]} },
      { q: "Does your child have recurrent throat infections or tonsillitis?", label: "Recurrent throat infections or tonsillitis", sign: "enlarged-tonsils" },
    ]
  },
  {
    title: "Facial & Dental Development",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D6B57" stroke-width="2"><path d="M12 3c-3 0-5 2-5 5 0 3 1 4 1 7 0 2 1 3 2 3s1.5-2 2-2 1.5 2 2 2 2-1 2-3c0-3 1-4 1-7 0-3-2-5-5-5z"/></svg>`,
    questions: [
      { q: "Does your child have crowded, crooked or misaligned teeth?", label: "Crowded, crooked or misaligned teeth", sign: "crowding" },
      { q: "Does your child have a narrow or high-arched palate?", label: "Narrow or high-arched palate", sign: "crowding",
        info: {"title": "A narrow or high-arched palate", "tips": ["Ask your child to open wide and tilt their head back, then look at the roof of their mouth with a torch.", "A high-arched palate looks deep and steep, like a tall dome or a “V”, rather than a gentle, wide curve.", "If you’re not sure, your dentist can check this for you."]} },
      { q: "Does your child have a significant overbite, overjet (buck teeth), underbite, or crossbite?", label: "Significant overbite, overjet, underbite or crossbite", sign: "crossbite",
        info: {"title": "Bite problems", "img": "images/crossbite.jpg", "tips": ["Overbite or overjet: the top front teeth cover the bottom ones deeply, or sit well in front of them (“buck teeth”).", "Underbite: the bottom front teeth sit in front of the top ones.", "Crossbite: some top teeth sit behind the bottom teeth when your child bites together."]} },
      { q: "Does your child have a long, narrow face or a recessed lower jaw?", label: "Long, narrow face or recessed lower jaw", sign: "body-posture",
        info: {"title": "A long face or recessed lower jaw", "tips": ["Look at your child side-on, with their teeth gently together.", "A recessed lower jaw means the chin sits noticeably further back than the upper lip.", "A long, narrow face often comes with a narrow smile."]} },
      { q: "Has your child had or been referred for orthodontic treatment involving extractions?", label: "Had or referred for orthodontic treatment with extractions" },
      { q: "Does your child have facial asymmetries (nostrils, eyes, cheeks, chin) or imbalances?", label: "Facial asymmetries or imbalances", sign: "facial-asymmetries",
        info: {"title": "Facial asymmetries", "img": "images/facial-asymmetries.jpg", "tips": ["Look straight at your child’s face in good light.", "Compare the left and right sides: nostrils, eyes, cheeks, the corners of the mouth and the chin.", "Answer Yes if one side looks clearly different from the other."]} },
      { q: "Does your child have black circles under the eyes?", label: "Dark circles under the eyes", sign: "dark-circles" },
      { q: "Is your child's profile concave or very convex?", label: "Concave or very convex profile", sign: "facial-asymmetries",
        info: {"title": "The side profile", "tips": ["Look at your child side-on while they’re relaxed.", "Very convex: the chin sits well back, so the face curves outward from forehead to nose to chin.", "Concave: the middle of the face looks flat or dished in, with the chin further forward."]} },
    ]
  },
  {
    title: "Tongue & Swallowing Function",
    sub: "Answer Yes or No to each question about your child.",
    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D6B57" stroke-width="2"><path d="M6 4h12v6a6 6 0 0 1-12 0V4z"/><path d="M9 20c0-2 1.5-3.5 3-3.5s3 1.5 3 3.5"/></svg>`,
    questions: [
      { q: "Does your child have a tongue thrust (tongue pushes between the teeth when swallowing or speaking)?", label: "Tongue thrust when swallowing or speaking", sign: "tongue-tie",
        info: {"title": "Tongue thrust", "tips": ["Watch your child swallow a sip of water, or say words with “S” and “T” sounds.", "Answer Yes if you can see the tongue pushing forward between the teeth."]} },
      { q: "Does your child have a lisp or difficulty with certain speech sounds (e.g. S, SH, TH)?", label: "Lisp or difficulty with certain speech sounds", sign: "speech-issues" },
      { q: "Has your child been seen by a speech and language therapist?", label: "Seen by a speech and language therapist", sign: "speech-issues" },
      { q: "Did your child have difficulties breastfeeding or was tongue tie (ankyloglossia) suspected?", label: "Breastfeeding difficulties or suspected tongue tie", sign: "tongue-tie",
        info: {"title": "Tongue tie", "img": "images/tongue-tie.jpg", "tips": ["Tongue tie is when the strip of tissue under the tongue is short or tight.", "Signs include a tongue that can’t poke out past the lips or lift to the top teeth, or looks heart-shaped when stuck out.", "Answer Yes if this was suspected, or if feeding was difficult as a baby."]} },
      { q: "Does your child prefer soft foods or avoid hard textures?", label: "Prefers soft foods or avoids hard textures", sign: "picky-eating" },
    ]
  },

// fade the main area in whenever we move to a new step
function showStep(){

function renderSection(){
  const s = sections[currentSection];
  const answeredCount = s.questions.filter((_, qi) => answers[questionKey(currentSection, qi)] !== undefined).length;
  const allAnswered = answeredCount === s.questions.length;
  const segs = sections.map((_, i) => {
    const fill = i < currentSection ? 1 : i === currentSection ? answeredCount / s.questions.length : 0;
    return `<span><i style="transform:scaleX(${fill})"></i></span>`;
  }).join('');

  app.innerHTML = `
    <p class="kicker page-kicker">Orofacial symptom checker — O.A.S</p>
    <div class="progress" aria-hidden="true">${segs}</div>
    <div class="section-head">
      <p class="section-meta">Section ${currentSection+1} of ${sections.length}</p>
      <h1>${s.title}</h1>
      <p class="sub">${s.sub}</p>
    </div>
    <div id="questions"></div>
    <div class="nav-row">
      ${currentSection > 0 ? `<button type="button" class="nav-back" id="backBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back</button>` : ''}
      <button type="button" class="nav-next" id="nextBtn" ${allAnswered ? '' : 'disabled'}>
        ${currentSection === sections.length - 1 ? 'Continue' : 'Next section'}
      </button>
    </div>
    ${allAnswered ? '' : `<p class="nav-hint">Answer every question in this section to continue (${answeredCount} of ${s.questions.length} done).</p>`}
  `;

  const qContainer = document.getElementById('questions');
  s.questions.forEach((item, qi) => {
    const key = questionKey(currentSection, qi);
    const current = answers[key];
    const fs = document.createElement('fieldset');
    fs.className = 'question';
    fs.innerHTML = `
      <legend>${window.MYO.withInfo(item.q, item.info ? `<button type="button" class="info-btn" aria-label="What to look for">${window.MYO.infoIcon}</button>` : '')}</legend>
      <div class="yn-row">
        <button type="button" class="yn-btn ${current === true ? 'selected ' + ((item.neg || 'yes') === 'yes' ? 'negative' : 'positive') : ''}" data-val="true" aria-pressed="${current === true}">Yes</button>
        <button type="button" class="yn-btn ${current === false ? 'selected ' + ((item.neg || 'yes') === 'no' ? 'negative' : 'positive') : ''}" data-val="false" aria-pressed="${current === false}">No</button>
      </div>
    `;
    fs.querySelectorAll('.yn-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const clickedVal = (btn.dataset.val === 'true');
        answers[key] = (answers[key] === clickedVal) ? undefined : clickedVal;
        if (answers[key] === undefined) delete answers[key];
        const y = window.scrollY;
        renderSection();
        window.scrollTo(0, y);
        const again = document.querySelectorAll('.question')[qi];
        if (again) again.querySelector(`.yn-btn[data-val="${btn.dataset.val}"]`).focus({ preventScroll:true });
      });
    });
    const infoBtn = fs.querySelector('.info-btn');
    if (infoBtn) infoBtn.addEventListener('click', () => openInfo(item.info, infoBtn));
    qContainer.appendChild(fs);
  });

  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { currentSection--; renderSection(); showStep(); window.scrollTo({top:0, behavior:'smooth'}); });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', () => {
    if (currentSection < sections.length - 1) {
      currentSection++;
      renderSection();
    } else {
      renderContactForm();
    }
    showStep();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- name formatting ----------
   "SARAH o'brien-SMITH" -> "Sarah O'Brien-Smith"
   Words typed in deliberate mixed case that already start with a
   capital (e.g. "McDonald", "DeVries") are left as typed. */
function formatName(raw){
  return raw.trim().replace(/\s+/g, ' ').split(' ').map(word =>
    word.split(/([-'’])/).map(part => {
      if (!part || /^[-'’]$/.test(part)) return part;
      const isMixed = part !== part.toLowerCase() && part !== part.toUpperCase();
      if (isMixed && part[0] === part[0].toUpperCase()) return part;
      return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
    }).join('')
  ).join(' ');
}

/* ---------- email checking ---------- */
const COMMON_DOMAINS = ['gmail.com','outlook.com','hotmail.com','live.com','yahoo.com','icloud.com','me.com',
  'bigpond.com','bigpond.net.au','optusnet.com.au','live.com.au','hotmail.com.au','outlook.com.au','yahoo.com.au',
  'tpg.com.au','iinet.net.au','internode.on.net','westnet.com.au','aapt.net.au'];

function editDistance(a, b){
  const d = Array.from({length:a.length+1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

// Returns { ok:false, msg } if the address can't be right,
// { ok:true, suggestion } if it looks like a typo of a common provider,
// or { ok:true } if it looks fine.
function checkEmail(raw){
  const email = raw.trim().toLowerCase();
  if (!email) return { ok:false, msg:'Please enter your email address.' };
  if (/\s/.test(email)) return { ok:false, msg:'Your email address can\'t contain spaces.' };
  const at = email.split('@');
  if (at.length !== 2) return { ok:false, msg:'Your email address needs exactly one "@" sign.' };
  const [local, domain] = at;
  if (!local || !/^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(local) || /^\.|\.$|\.\./.test(local))
    return { ok:false, msg:'Please check the part of your email before the "@".' };
  // fix common ending typos first: .con -> .com, .com.a -> .com.au
  let fixed = domain
    .replace(/\.(con|cmo|ocm|vom|xom|comm|cpm)$/, '.com')
    .replace(/\.com\.(a|aus|ua)$/, '.com.au')
    .replace(/\.net\.(a|aus|ua)$/, '.net.au');
  if (!COMMON_DOMAINS.includes(fixed)) {
    let best = null, bestDist = 3;
    for (const d of COMMON_DOMAINS) {
      const dist = editDistance(fixed, d);
      if (dist < bestDist) { best = d; bestDist = dist; }
    }
    if (best && bestDist <= 2 && fixed.length > 5) fixed = best;
  }
  const validDomain = d => /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/.test(d);
  if (!validDomain(fixed))
    return { ok:false, msg:'Please check the part of your email after the "@" (e.g. gmail.com).' };
  if (fixed !== domain) return { ok:true, email, suggestion: local + '@' + fixed };
  return { ok:true, email };
}

function isNoticed(item, val){
  const concerning = (item.neg || 'yes') === 'yes';
  return concerning ? val === true : val === false;
}

function computeResults(){
  const bySection = sections.map((s, si) => ({
    title: s.title,
    icon: s.icon,
    items: s.questions
      .filter((item, qi) => isNoticed(item, answers[questionKey(si, qi)]))
      .map(item => item.label || item.q)
  })).filter(sec => sec.items.length > 0);
  const total = bySection.reduce((n, sec) => n + sec.items.length, 0);
  return { bySection, total };
}

// Plain text only. The email template shows it with {{symptoms_list}} (two braces),
// so EmailJS escapes it and nobody can slip their own HTML into an email.
function buildSymptomsText(bySection){
  if (!bySection.length) return 'No signs were reported.';
  return bySection.map(sec => sec.title.toUpperCase() + '\n' + sec.items.map(i => '•  ' + i).join('\n')).join('\n\n');
}

const RECOMMENDATION = "We recommend booking an appointment with your GP or a qualified health practitioner to talk through these signs. Bring this summary with you — it will help them understand what you've noticed.";
const RECOMMENDATION_NONE = "You didn't report any of the signs we asked about. If you still have concerns about your child's breathing, sleep or development, it's always worth speaking with your GP or a qualified health practitioner.";

let lastEmailStatus = null; // 'success' | 'error' | null

let resendCount = 0;
let sending = false;

function sendReportEmail(token){
  if (typeof emailjs === 'undefined' || EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
    return Promise.reject(new Error('EmailJS not configured'));
  }
  const r = computeResults();
  const templateParams = {
    to_email: contactInfo.email || CLINIC_EMAIL,   // the parent who filled in the form
    clinic_email: CLINIC_EMAIL,                    // put {{clinic_email}} in the template's Bcc field
    parent_name: contactInfo.parentName || '',
    child_name: contactInfo.childName || '',
    child_age: contactInfo.childAge || '',
    parent_email: contactInfo.email || '',
    main_concern: contactInfo.concern || '(not provided)',
    symptom_count: r.total,
    symptoms_list: buildSymptomsText(r.bySection),   // use {{symptoms_list}} (two braces) in the template
    recommendation: r.total ? RECOMMENDATION : RECOMMENDATION_NONE,
    submitted_at: new Date().toLocaleString('en-AU', { dateStyle:'long', timeStyle:'short' }),
  };
  if (token) templateParams['g-recaptcha-response'] = token;
  sending = true;
  return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
    .finally(() => {
      sending = false;
      if (RECAPTCHA_SITE_KEY && window.grecaptcha) { try { window.grecaptcha.reset(recaptchaWidget); } catch(e) {} }
    });
}

  app.innerHTML = `

      <h1>${who} symptom checker summary</h1>
      <p class="summary-sub">${r.total
        ? `You noticed <b>${r.total}</b> of the signs we asked about. They're listed below — tap the ⓘ beside a sign to read more about it.`
        : `You didn't report any of the signs we asked about.`}</p>
    </div>
    <div class="rec-box">
      <p class="kicker">Our recommendation</p>
      <p class="rec-text">${r.total ? RECOMMENDATION : RECOMMENDATION_NONE}</p>
    </div>
    <p class="results-note">This is a symptom checker only — it doesn't diagnose any condition. A diagnosis can only be made after a clinical examination.</p>

    <h2 class="section-heading">Signs you noticed</h2>
    ${symptomsHtml}

    ${skipped ? `
    <div class="card-block">
      <h3>Want a copy for your appointment?</h3>
      <p class="next-desc">Nothing has been emailed yet. If you'd like this summary sent to you, so you can show it to your GP or health practitioner, add your details and we'll email it.</p>
      <div class="next-buttons">
        <button type="button" class="btn btn-primary" id="emailReportBtn">${mailIcon}Email this report</button>
        <a class="btn btn-secondary" href="index.html">Learn about the signs</a>
      </div>
    </div>
    ` : `
    <div class="card-block">
      <div class="report-row">
        <div>
          <p class="report-title">${lastEmailStatus === 'success' ? 'Summary sent to' : 'Summary not sent'}</p>
          ${lastEmailStatus === 'success' ? `<p class="report-email">${email}</p>` : `<p class="report-email" style="color:var(--error);">We couldn't send your summary automatically. Please contact us directly.</p>`}
        </div>
        <a class="resend-link" id="resendLink" href="#" role="button">${mailIcon}<span id="resendLabel">Resend summary</span></a>
      </div>
      <p class="report-desc">${lastEmailStatus === 'success' ? "A copy of this summary has been sent to your email so you can take it to your appointment." : "If this keeps happening, please email us directly using the button below."}</p>
    </div>

    <div class="card-block">
      <h3>What happens next?</h3>
      <p class="next-desc">A copy of your summary has also been shared with our team at <b>myoscreening@gmail.com</b>. If you have questions about any of the signs above, you're welcome to get in touch.</p>
      <div class="next-buttons">
        <a class="btn btn-primary" href="mailto:myoscreening@gmail.com">${mailIcon}Email us</a>
        <a class="btn btn-secondary" href="index.html">Learn about the signs</a>
      </div>
    </div>
    `}

    <div class="restart-row">
      <a class="restart-link" id="restartLink" href="#" role="button">Start over</a>
    </div>
  `;

  app.querySelectorAll('.info-btn[data-sign]').forEach(b =>
    b.addEventListener('click', () => openSignInfo(b.dataset.sign, b)));

  const resendBtn = document.getElementById('resendLink');
  if (resendBtn) resendBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (sending) return;
    const label = document.getElementById('resendLabel');
    if (resendCount >= 2) { label.textContent = 'Please email us instead'; return; }
    if (RECAPTCHA_SITE_KEY) {            // each send needs a fresh "I'm not a robot" tick
      renderContactForm(true); showStep(); window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    resendCount++;
    resendBtn.setAttribute('aria-disabled', 'true');
    label.textContent = 'Sending…';
    sendReportEmail()
      .then(() => {
        lastEmailStatus = 'success';
        label.textContent = 'Sent!';
        setTimeout(() => renderResults('emailed'), 900);
      })
      .catch(() => {
        lastEmailStatus = 'error';
        label.textContent = 'Failed — try again';
        resendBtn.removeAttribute('aria-disabled');
      });
  });

  const emailReportBtn = document.getElementById('emailReportBtn');
  if (emailReportBtn) emailReportBtn.addEventListener('click', () => {
    renderContactForm(true);
    showStep();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  document.getElementById('restartLink').addEventListener('click', (e) => {
    e.preventDefault();
    currentSection = 0;
    lastEmailStatus = null;
    Object.keys(formDraft).forEach(k => formDraft[k] = (k === 'consent' ? false : ''));
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(contactInfo).forEach(k => delete contactInfo[k]);
    resendCount = 0;
    clearProgress();
    renderSection();
    showStep();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

/* ============================================================
   KEEP PROGRESS (refresh and the browser Back button)
   ------------------------------------------------------------
   Answers and the current step are kept in sessionStorage for
   this browser tab only; they're cleared when the tab closes or
   the parent presses "Start over". Names and email are NOT
   stored. Each step is a browser history entry, so Back goes to
   the previous section instead of leaving the checker.
   ============================================================ */
const PROGRESS_KEY = 'myo-checker-progress';
let view = { step:'section', section:0 };
let restoring = false;

function viewHash(v){
  if (v.step === 'section') return '#section-' + (v.section + 1);
  if (v.step === 'form') return v.fromResults ? '#email-report' : '#your-details';
  return '#results';
}
function sameView(a, b){
  return a && b && a.step === b.step && a.section === b.section && a.mode === b.mode && !!a.fromResults === !!b.fromResults;
}
function recordView(v){
  view = v;
  try { sessionStorage.setItem(PROGRESS_KEY, JSON.stringify({ answers, view: v, at: Date.now() })); } catch(e) {}
  try {
    if (restoring || sameView(history.state, v)) history.replaceState(v, '', viewHash(v));
    else history.pushState(v, '', viewHash(v));
  } catch(e) {}
}
function clearProgress(){ try { sessionStorage.removeItem(PROGRESS_KEY); } catch(e) {} }

// wrap the three screens so every visit is recorded
const _renderSection = renderSection;
renderSection = function(){ _renderSection(); recordView({ step:'section', section: currentSection }); };
const _renderContactForm = renderContactForm;
renderContactForm = function(fromResults = false){ _renderContactForm(fromResults); recordView({ step:'form', fromResults: !!fromResults }); };
const _renderResults = renderResults;
renderResults = function(mode = 'emailed'){
  if (mode === 'emailed' && !contactInfo.email) mode = 'skipped';   // e.g. after a refresh: details aren't kept
  _renderResults(mode); recordView({ step:'results', mode });
};

function showView(v){
  restoring = true;
  try {
    if (!v || v.step === 'section') { currentSection = Math.min(Math.max((v && v.section) || 0, 0), sections.length - 1); renderSection(); }
    else if (v.step === 'form') renderContactForm(!!v.fromResults);
    else renderResults(v.mode || 'skipped');
  } finally { restoring = false; }
  showStep();
  if (window.MYO.overlay) { const p = document.getElementById('infoPanel'); if (window.MYO.overlay.isOpen(p)) window.MYO.overlay.close(p); }
}

window.addEventListener('popstate', e => { if (e.state && e.state.step) { showView(e.state); window.scrollTo(0, 0); } });

(function start(){
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(PROGRESS_KEY) || 'null'); } catch(e) {}
  if (saved && saved.answers && Object.keys(saved.answers).length) {
    Object.assign(answers, saved.answers);
    showView(saved.view);
  } else {
    showView({ step:'section', section:0 });
  }
})();
</script>
</body>
</html>
